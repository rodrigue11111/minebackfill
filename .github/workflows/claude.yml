# IA mainteneuse du depot (Claude Code en action GitHub).
#
# Usage (enseignant ou mainteneur, AUCUNE installation locale) :
#   1. GitHub -> Issues -> New issue ;
#   2. decrire la demande en francais et mentionner @claude dans le texte ;
#   3. l'IA lit le depot (CLAUDE.md -> CONTEXTE_PROJET_IA.md -> docs/),
#      fait la modification sur une branche et OUVRE UNE PULL REQUEST ;
#   4. la CI (tests d'or + typecheck/build) tourne sur la PR ; Vercel genere
#      un apercu cliquable ; RIEN ne part en production sans clic « Merge ».
#
# Activation (une fois) : GitHub -> Settings -> Secrets and variables ->
# Actions -> ajouter ANTHROPIC_API_KEY (cle creee sur console.anthropic.com,
# facturation a l'usage). Sans le secret, un declenchement echoue sans effet.
#
# Securite (depot PUBLIC) : seuls le proprietaire, les membres et les
# collaborateurs du depot peuvent declencher l'IA — un @claude poste par un
# inconnu est ignore (garde author_association ci-dessous).

name: Claude (IA mainteneuse)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
