# Maintient le projet Supabase actif (l'offre gratuite met le projet en pause
# apres ~7 jours sans activite — piege n°1 en usage semestriel, voir
# docs/OPERATIONS.md). Deux requetes par semaine suffisent.
#
# Activation (une fois) : GitHub -> Settings -> Secrets and variables ->
# Actions -> ajouter SUPABASE_URL et SUPABASE_ANON_KEY (memes valeurs que dans
# Vercel).
#
# Sans ces secrets, la tache ECHOUE (croix rouge + courriel de GitHub). Avant,
# elle s'ignorait « poliment » : 22 executions vertes n'avaient jamais touche
# la base, et le projet pouvait se mettre en pause sans que personne ne le
# sache. Une tache de surveillance qui reussit sans rien surveiller est pire
# que pas de tache du tout.
#
# Limite de GitHub : dans un depot public, les taches planifiees sont
# DESACTIVEES apres 60 jours sans activite sur le depot (voir OPERATIONS.md).

name: Supabase keep-alive

on:
  schedule:
    # Lundi et jeudi a 12:00 UTC.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requete de maintien d'activite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY absents : la base n'est PAS maintenue active. Les ajouter dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Vraie requete base de donnees (lecture publique RLS des catalogues)
          # pour compter comme activite, pas un simple ping HTTP.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/official_catalogs?select=id&limit=1")
          echo "HTTP $code"
          # Seul un 2xx prouve que la requete a atteint la base. Un 4xx veut
          # dire cle refusee (401) ou table absente (404) : la requete s'arrete
          # AVANT la base et ne compte probablement pas comme activite.
          case "$code" in
            2*) exit 0 ;;
            4*) echo "::error::Requete refusee (HTTP $code) : verifier les secrets (cle anon, URL du projet)."; exit 1 ;;
            *) echo "::error::Projet injoignable (HTTP $code) - probablement en pause. supabase.com > le projet > Restore."; exit 1 ;;
          esac
