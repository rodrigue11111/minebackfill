# Maintient le projet Supabase actif (l'offre gratuite met le projet en pause
# apres ~7 jours sans activite — piege n°1 en usage semestriel, voir
# docs/OPERATIONS.md). Deux requetes par semaine suffisent.
#
# Activation (une fois) : GitHub -> Settings -> Secrets and variables ->
# Actions -> ajouter SUPABASE_URL et SUPABASE_ANON_KEY (memes valeurs que dans
# Vercel). Sans ces secrets, la tache s'ignore poliment (aucun echec).

name: Supabase keep-alive

on:
  schedule:
    # Lundi et jeudi a 12:00 UTC.
    - cron: "0 12 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requete de maintien d'activite
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_ANON_KEY absents - etape ignoree."
            exit 0
          fi
          # Vraie requete base de donnees (lecture publique RLS des catalogues)
          # pour compter comme activite, pas un simple ping HTTP.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/official_catalogs?select=id&limit=1")
          echo "HTTP $code"
          # 200 = OK ; 4xx = projet joignable quand meme (compte comme activite).
          case "$code" in
            2*|4*) exit 0 ;;
            *) echo "Projet injoignable (HTTP $code) - probablement en pause."; exit 1 ;;
          esac
